modLoader = "javafml"
loaderVersion = "[0,)"
license = "MIT"

[[mods]]
modId = "crankshaft"
version = "${version}"
displayName = "CrankShaft"
description = "Dual-backend (raw OpenGL + raw Vulkan) instanced rendering engine."
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "flywheel.impl.mixins.json"

[[mixins]]
config = "flywheel.impl.neoforge.mixins.json"

[[mixins]]
config = "flywheel.impl.sodium.mixins.json"

[[mixins]]
config = "flywheel.backend.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[accessTransformers]]
file = "META-INF/crankshaft-access.cfg"

[[accessTransformers]]
file = "META-INF/tenon-access-compileJava.cfg"

[[dependencies.crankshaft]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_neoforge_range}"
side = "CLIENT"

[[dependencies.crankshaft]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
side = "CLIENT"

[[dependencies.crankshaft]]
modId = "sodium"
type = "optional"
versionRange = "${sodium_neoforge_range}"
side = "CLIENT"

[[dependencies.crankshaft]]
modId = "entityculling"
type = "optional"
versionRange = "[1.11.2,)"
side = "CLIENT"
