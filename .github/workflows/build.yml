name: CI Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build mod jars
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.5.0
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-jars
          path: |
            build/libs/*.jar
          if-no-files-found: error

      - name: Resolve snapshot versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'Warfactory-Official/CrankShaft'
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION=$(grep -E '^\s*modVersion\s*=' version.properties | sed -E 's/^\s*modVersion\s*=\s*//; s/\r$//' | xargs || true)
          VANILLIN_VERSION=$(grep -E '^\s*vanillinVersion\s*=' version.properties | sed -E 's/^\s*vanillinVersion\s*=\s*//; s/\r$//' | xargs || true)
          if [[ -z "${MOD_VERSION}" ]]; then
            echo "::error::modVersion is empty or missing in version.properties"; exit 1
          fi
          if [[ -z "${VANILLIN_VERSION}" ]]; then
            echo "::error::vanillinVersion is empty or missing in version.properties"; exit 1
          fi
          echo "SNAPSHOT_VERSION=${MOD_VERSION}-SNAPSHOT" >> "$GITHUB_ENV"
          echo "VANILLIN_SNAPSHOT_VERSION=${VANILLIN_VERSION}-SNAPSHOT" >> "$GITHUB_ENV"

      - name: Publish snapshots to Maven (warfactory)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'Warfactory-Official/CrankShaft'
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_URL: https://repo.warfactory.co/snapshots
          RELEASE_VERSION: ${{ env.SNAPSHOT_VERSION }}
          VANILLIN_RELEASE_VERSION: ${{ env.VANILLIN_SNAPSHOT_VERSION }}
        run: |
          ./gradlew \
            publishCrankshaftPublicationToWarfactoryRepository \
            publishVanillatePublicationToWarfactoryRepository \
            --no-daemon \
            --stacktrace
