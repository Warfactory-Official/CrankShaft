name: CI Build

on:
  push:
    branches:
      - 26.2
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build mod jars
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.5.0
          cache-read-only: ${{ github.ref != 'refs/heads/26.2' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-jars
          path: |
            build/mods/*.jar
          if-no-files-found: error

      - name: Publish snapshots to Maven (warfactory)
        if: github.event_name == 'push' && github.ref == 'refs/heads/26.2' && github.repository == 'Warfactory-Official/CrankShaft'
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_URL: https://repo.warfactory.co/snapshots
        run: |
          ./gradlew \
            :fabric:publishMavenJarPublicationToWarfactoryRepository \
            :neoforge:publishMavenJarPublicationToWarfactoryRepository \
            --no-daemon \
            --stacktrace
