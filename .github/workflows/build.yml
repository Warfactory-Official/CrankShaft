name: CI Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build bundled mod jars
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve shared snapshot version
        id: version
        shell: python
        run: |
          import os
          from pathlib import Path

          def property_value(path, key):
              values = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  name, separator, value = line.partition("=")
                  if separator and name.strip() == key:
                      values.append(value.strip())
              if len(values) != 1 or not values[0]:
                  raise SystemExit(f"::error::{key} must occur once and be nonempty in {path.name}")
              return values[0]

          base = property_value(Path("version.properties"), "modVersion")
          minecraft = property_value(Path("buildscript.properties"), "minecraftVersion")
          version = f"{base}+mc{minecraft}"
          version += "-SNAPSHOT"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
          print(version)

      - name: Set reproducible snapshot timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew build -Pbuild.snapshot=true --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ steps.version.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish snapshots to Maven
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'Warfactory-Official/CrankShaft'
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_URL: https://repo.warfactory.co/snapshots
        run: |
          ./gradlew \
            -Pbuild.snapshot=true \
            publishVanillatePublicationToWarfactoryRepository \
            publishCrankshaftPublicationToWarfactoryRepository \
            --no-daemon \
            --stacktrace
