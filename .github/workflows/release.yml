name: Release CrankShaft

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-crankshaft-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish tagged release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify release tag
        id: release
        shell: python
        run: |
          import os
          from pathlib import Path

          def property_value(path, key):
              values = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  name, separator, value = line.partition("=")
                  if separator and name.strip() == key:
                      values.append(value.strip())
              if len(values) != 1 or not values[0]:
                  raise SystemExit(f"::error::{key} must occur once and be nonempty in {path.name}")
              return values[0]

          base = property_value(Path("version.properties"), "modVersion")
          minecraft = property_value(Path("buildscript.properties"), "minecraftVersion")
          version = f"{base}+mc{minecraft}"
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"::error::Tag {tag} does not match v{version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
          print(version)

      - name: Build bundled release
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish both artifacts to Maven
        if: github.repository == 'Warfactory-Official/CrankShaft'
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_URL: https://repo.warfactory.co/releases
        run: |
          ./gradlew \
            publishVanillatePublicationToWarfactoryRepository \
            publishCrankshaftPublicationToWarfactoryRepository \
            --no-daemon \
            --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-jars
          path: build/libs/*.jar
          if-no-files-found: error
